name: Source rule publisher
on:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '47 */3 * * *'
    - cron: '29 3 * * *'
    - cron: '7 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Monitoring or bounded native verification; production remains disabled
        type: choice
        default: monitor
        options: [monitor, retry, deep, weekly, audit, staging, production]
      source:
        description: Registered source ID, or all
        type: string
        default: all
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('mangaro-source-rule-publisher-{0}', github.ref) || 'mangaro-source-monitoring' }}
  cancel-in-progress: false
env:
  MANGARO_AUTOPUBLISH_ENABLED: 'false'
  AUTOPUBLISH_ENABLED: 'false'
jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Filter changes inside the required check
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/source-rules/automation/changes.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.changes.outputs.fast == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/source-rules/automation/requirements.txt
      - name: Fast dependencies
        if: steps.changes.outputs.fast == 'true'
        run: python -m pip install -r tools/source-rules/automation/requirements.txt
      - name: Deterministic reliability and existing regression tests
        if: steps.changes.outputs.fast == 'true'
        run: python -m unittest discover -s tools/source-rules/automation -p 'test_*.py' -v
      - name: Validate changed workflows
        if: steps.changes.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=''
      - name: Check result summary
        if: always()
        run: |
          printf 'Fast checks result: %s\n' "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
        env:
          CHECK_STATUS: ${{ job.status }}
  plan:
    if: github.repository == 'abderrahimgourram/mangaro-source-rule-publisher' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      work: ${{ steps.plan.outputs.work }}
      native: ${{ steps.plan.outputs.native }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject production publication
        if: inputs.mode == 'production'
        run: |
          printf 'Production publishing is disabled. Explicit code and environment review is required.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Restore trusted history and select only due sources
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MONITOR_MODE: ${{ (inputs.mode == 'audit' || inputs.mode == 'staging') && 'manual' || inputs.mode || 'monitor' }}
          MONITOR_SOURCE: ${{ inputs.source || 'all' }}
        run: python3 tools/source-rules/automation/plan.py --system manga --restore --mode "$MONITOR_MODE" --source "$MONITOR_SOURCE"
      - name: Transfer selection and trusted history inside this run
        if: steps.plan.outputs.work == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: health-plan-${{ github.run_id }}
          path: |
            health-plan.json
            .source-health/state.json
          include-hidden-files: true
          retention-days: 1
      - name: Scheduler report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: health-plan-report-${{ github.run_id }}
          path: health-plan-report.json
          if-no-files-found: ignore
          retention-days: 7
  lightweight:
    needs: plan
    if: needs.plan.outputs.work == 'true' && needs.plan.outputs.native != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: health-plan-${{ github.run_id }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .publisher-state
          key: mangaro-publisher-state-v1-${{ github.run_id }}
          restore-keys: mangaro-publisher-state-v1-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/source-rules/automation/requirements.txt
      - run: python -m pip install -r tools/source-rules/automation/requirements.txt
      - name: Bounded checks; no production credentials or Android tools
        run: python tools/source-rules/automation/monitor.py
      - name: Check history checkpoint is nonempty
        if: always()
        id: history
        run: python3 tools/source-rules/automation/reliability.py --checkpoint .source-health/state.json
      - name: Persist source monitoring history
        if: always() && steps.history.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-health-state-v1
          path: .source-health/state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Sanitized source report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-health-report-${{ github.run_id }}
          path: publisher-report.json
          if-no-files-found: warn
          retention-days: 7
  native:
    needs: plan
    if: needs.plan.outputs.work == 'true' && needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: health-plan-${{ github.run_id }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .publisher-state
          key: mangaro-publisher-state-v1-${{ github.run_id }}
          restore-keys: mangaro-publisher-state-v1-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/source-rules/automation/requirements.txt
      - run: python -m pip install -r tools/source-rules/automation/requirements.txt
      - name: Fast safety checks before native execution
        run: python -m unittest discover -s tools/source-rules/automation -p 'test_*.py' -v
      - name: Reserve selected sources and checkpoint history before building
        if: inputs.mode != 'staging'
        run: python tools/source-rules/automation/monitor.py --reserve
      - name: Existing isolated staging path (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'staging'
        env:
          MANGARO_AUTOMATION_SECRET: ${{ secrets.MANGARO_STAGING_AUTOMATION_SECRET }}
          MANGARO_VERCEL_TOKEN: ${{ secrets.MANGARO_VERCEL_TOKEN }}
        run: python tools/source-rules/automation/staging_e2e.py --report staging-receipt.json
      - name: Free unused SDK space on this ephemeral hosted runner
        run: sudo rm -rf /usr/share/dotnet
      - name: Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version
      - name: Gradle build cache
        id: gradle_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mangaro-publisher-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/*.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'PUBLISHER_ANDROID_HEAD') }}
          restore-keys: mangaro-publisher-gradle-${{ runner.os }}-
      - name: Build opt-in production parser audit (no signing secret available)
        run: ./gradlew -PsourceAudit=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Save successful build cache before later acceptance steps
        if: steps.gradle_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mangaro-publisher-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/*.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'PUBLISHER_ANDROID_HEAD') }}
      - name: Release build JVM memory before starting Android
        run: ./gradlew --stop
      - name: Enable acceleration in the ephemeral GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator production path acceptance (emulator-5554 only)
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          PUBLISHER_MODE: ${{ inputs.mode }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -port 5554
          disable-animations: true
          script: bash tools/source-rules/automation/emulator-audit.sh
      - name: Ingest native results without publication authority
        if: inputs.mode != 'staging'
        run: python tools/source-rules/automation/monitor.py --native-evidence native-evidence.json
      - name: Check history checkpoint is nonempty
        if: always()
        id: history
        run: python3 tools/source-rules/automation/reliability.py --checkpoint .source-health/state.json
      - name: Persist source monitoring history
        if: always() && inputs.mode != 'staging' && steps.history.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-health-state-v1
          path: .source-health/state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Native execution summary
        if: always()
        env:
          NATIVE_STATUS: ${{ job.status }}
        run: |
          printf 'Native CI execution: %s; source health is reported separately.\n' "$NATIVE_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: Sanitized reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-health-report-${{ github.run_id }}
          path: |
            publisher-report.json
            staging-receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Delete ephemeral raw evidence
        if: always()
        run: rm -f native-evidence.json publisher-android-result.txt
  code-native:
    needs: checks
    if: needs.checks.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version-file: .github/.java-version
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mangaro-code-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/*.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Targeted source tests and instrumentation compilation (no credentials)
        run: ./gradlew -I tools/source-rules/automation/offline-tests.gradle -PsourceAudit=true :app:testDebugUnitTest --tests 'eu.kanade.tachiyomi.source.internal.*' :app:compileDebugAndroidTestKotlin
      - name: Compilation summary
        if: always()
        env:
          NATIVE_STATUS: ${{ job.status }}
        run: |
          printf 'Source compilation/tests: %s. One desktop-HTTP live probe is excluded from deterministic CI; registered-source network and reader acceptance stays in the daily/weekly native tier.\n' "$NATIVE_STATUS" >> "$GITHUB_STEP_SUMMARY"
